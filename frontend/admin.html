<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Toilet Near Me</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="admin/admin.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
</head>

<body class="admin-dashboard-page">

  <header class="admin-header">
    <div class="admin-brand-section">
      <a href="pages/home.html" class="btn btn-secondary" aria-label="Tutup"
        style="font-size: 1.25rem; font-weight: 700; width: 36px; height: 36px; padding: 0; line-height: 1;">&times;</a>
      <h2 class="admin-title">🛡️ Admin Dashboard</h2>
    </div>
    <div class="admin-nav">
      <button class="admin-nav-btn active" data-tab="pending" onclick="loadAdminReports('pending')">Pending</button>
      <button class="admin-nav-btn" data-tab="approved" onclick="loadAdminReports('approved')">Approved</button>
      <button class="admin-nav-btn" data-tab="rejected" onclick="loadAdminReports('rejected')">Rejected</button>
    </div>
  </header>

  <div class="admin-content">
    <div class="admin-card">
      <div class="admin-table-wrapper">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Tanggal</th>
              <th>Nama Toilet</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="adminTableBody">
            <!-- Dynamic Content -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="admin/admin.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const ok = await requireAdmin();
      if (!ok) return;
      loadAdminReports('pending');
    });
  </script>
  <div id="imageLightbox" class="image-lightbox">
    <span class="close-lightbox">&times;</span>
    <img class="lightbox-content" id="expandedImage" alt="Gambar Laporan Penuh">
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const lightbox = document.getElementById('imageLightbox');
      const expandedImg = document.getElementById('expandedImage');
      const closeBtn = document.querySelector('.close-lightbox');

      // Fungsi membuka lightbox
      function openLightbox(imgElement) {
        expandedImg.src = imgElement.src;
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden'; // Cegah scroll di belakang
      }

      // Fungsi menutup lightbox
      function closeLightbox() {
        lightbox.classList.remove('active');
        expandedImg.src = '';
        document.body.style.overflow = ''; // Kembalikan scroll
      }

      // ✅ PERBAIKAN: Gunakan Event Delegation untuk konten dinamis
      // Kita dengarkan klik di seluruh body, lalu cek apakah yang diklik adalah gambar
      document.body.addEventListener('click', function (e) {
        // .closest() akan mencari elemen dengan class tersebut, 
        // bahkan jika yang diklik adalah bagian dalam dari elemen itu
        const clickedImage = e.target.closest('.review-image-preview');

        if (clickedImage) {
          openLightbox(clickedImage);
        }
      });

      // 2. Tutup saat tombol X diklik
      if (closeBtn) {
        closeBtn.addEventListener('click', closeLightbox);
      }

      // 3. Tutup saat area hitam di luar gambar diklik
      lightbox.addEventListener('click', function (e) {
        if (e.target === lightbox) {
          closeLightbox();
        }
      });

      // 4. Tutup dengan tombol ESC di keyboard
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && lightbox.classList.contains('active')) {
          closeLightbox();
        }
      });
    });
  </script>
</body>

</html>
